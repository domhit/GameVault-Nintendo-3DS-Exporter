name: Build Nintendo 3DS Exporter
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      CTRULIB: /opt/devkitpro/libctru
      PORTLIBS: /opt/devkitpro/portlibs/3ds
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DSX
        run: make -j2
      - name: Prepare SD package
        run: |
          mkdir -p dist/3ds/GameVault-3DS-Exporter
          cp GameVault-3DS-Exporter.3dsx dist/3ds/GameVault-3DS-Exporter/
          cp README_SD.txt dist/3ds/GameVault-3DS-Exporter/README.txt
          cd dist && zip -r ../GameVault-Nintendo-3DS-Exporter_v0.1.0-dev3.zip 3ds
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameVault-Nintendo-3DS-Exporter-v0.1.0-dev3
          path: |
            GameVault-3DS-Exporter.3dsx
            GameVault-Nintendo-3DS-Exporter_v0.1.0-dev3.zip
          if-no-files-found: error
